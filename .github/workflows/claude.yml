name: Claude Code

# Runs Claude Code on this repo when the owner mentions @claude, or labels an
# issue `ready-for-agent`. Only the owner can trigger it, because each run spends
# the owner's Claude subscription. Follow docs/agents/fork-maintenance.md.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      github.actor == 'eoliphan' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && github.event.action != 'labeled' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
        (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'ready-for-agent')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    env:
      # A PAT (or App token) lets CI run on PRs that Claude opens.
      GH_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install tools
        run: cargo install checkle just --locked

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # A label gives Claude no comment to act on, so it gets a fixed prompt.
          # A mention keeps the empty prompt and follows the comment text.
          prompt: "${{ github.event_name == 'issues' && github.event.action == 'labeled' && format('Implement issue #{0} ({1}). Read docs/agents/fork-maintenance.md and the issue with `gh issue view {0} --comments`. Create a branch named agent/issue-{0}-<short-slug> from main. Make the change, add tests, run `just check-ci`, and fix failures. Commit with a Conventional Commits message. Push the branch and open a PR to main with `gh pr create`. The PR body must contain `Closes #{0}`. Never push to main. If the issue is ambiguous, or a fork decision conflicts with it, comment on the issue and stop.', github.event.issue.number, github.event.issue.title) || '' }}"

          # Temporary: show the agent's full output while debugging issue-triggered runs.
          show_full_output: true

          claude_args: >-
            --max-turns 80
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(just:*),Bash(cargo:*),Bash(rg:*),Bash(fd:*)"
